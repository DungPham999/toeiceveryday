<!DOCTYPE html>
<html lang="vi">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>TOEIC EVERYDAY · Đăng nhập</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  align-items:center;
  justify-content:center;

  padding:24px;

  font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

  background:
    linear-gradient(
      135deg,
      #fffaf2,
      #fff2d8
    );

  color:#332619;
}


.login-card{
  width:min(100%,440px);

  background:white;

  border:
    1px solid #f0dcc0;

  border-radius:24px;

  padding:34px;

  box-shadow:
    0 18px 60px
    rgba(100,60,10,.12);
}


.logo{
  width:58px;
  height:58px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:18px;

  background:#ff9700;

  color:white;

  font-size:30px;
  font-weight:900;

  margin-bottom:22px;
}


.eyebrow{
  font-size:13px;
  font-weight:900;

  letter-spacing:1.5px;

  color:#d66f00;
}


h1{
  margin:8px 0 10px;

  font-size:31px;
  line-height:1.12;
}


.desc{
  color:#786858;
  line-height:1.6;

  margin-bottom:26px;
}


label{
  display:block;

  font-weight:800;

  margin-bottom:8px;
}


.password-wrap{
  display:flex;
  gap:8px;
}


input{
  width:100%;
  height:50px;

  border:
    1px solid #dfc9aa;

  border-radius:13px;

  padding:0 14px;

  font-size:17px;

  outline:none;
}


input:focus{
  border-color:#ff9700;

  box-shadow:
    0 0 0 3px
    rgba(255,151,0,.12);
}


.show-btn{
  min-width:58px;

  border:
    1px solid #dfc9aa;

  border-radius:13px;

  background:#fffaf2;

  cursor:pointer;

  font-size:18px;
}


.login-btn{
  width:100%;
  height:52px;

  margin-top:14px;

  border:0;
  border-radius:13px;

  background:
    linear-gradient(
      135deg,
      #ff9e00,
      #ed7d00
    );

  color:white;

  font-size:16px;
  font-weight:900;

  cursor:pointer;
}


.message{
  min-height:24px;

  margin-top:13px;

  font-size:14px;

  color:#c73c25;
}


.note{
  margin-top:20px;

  padding-top:18px;

  border-top:
    1px solid #f0e2cf;

  color:#847463;

  font-size:13px;
  line-height:1.5;
}

</style>

</head>


<body>

<div class="login-card">

  <div class="logo">✓</div>

  <div class="eyebrow">
    TOEIC EVERYDAY
  </div>

  <h1>
    Nhập mật khẩu lớp học
  </h1>

  <p class="desc">
    Bộ đề này dành cho học viên
    được giáo viên cấp quyền truy cập.
  </p>


  <form id="loginForm">

    <label for="password">
      Mật khẩu
    </label>


    <div class="password-wrap">

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        autofocus
        required
      >

      <button
        id="showPassword"
        class="show-btn"
        type="button"
      >
        👁
      </button>

    </div>


    <button
      class="login-btn"
      type="submit"
    >
      Vào làm bài →
    </button>


    <div
      id="message"
      class="message"
    ></div>

  </form>


  <div class="note">
    Nếu bạn chưa có mật khẩu,
    vui lòng liên hệ giáo viên.
  </div>

</div>


<script>

const AUTH_KEY =
  "toeic-everyday-auth";


/*
  HASH NÀY PHẢI GIỐNG HỆT
  shared/auth/auth.js
*/

const PASSWORD_HASH =
  "2b9739ac3f069e8cd93a972da4d7db564ec4d1fd9a7b482c0d1b8635b0ed5666";


async function sha256(text){

  const data =
    new TextEncoder()
      .encode(text);

  const hashBuffer =
    await crypto.subtle.digest(
      "SHA-256",
      data
    );

  const hashArray =
    Array.from(
      new Uint8Array(hashBuffer)
    );

  return hashArray
    .map(
      byte =>
        byte
          .toString(16)
          .padStart(2,"0")
    )
    .join("");

}


document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const password =
        document
          .getElementById("password")
          .value;


      const message =
        document
          .getElementById("message");


      const hash =   
        await sha256(password);


      if(hash === PASSWORD_HASH){

        localStorage.setItem(
          AUTH_KEY,
          PASSWORD_HASH
        );


        const returnUrl =
          sessionStorage.getItem(
            "toeic-return-url"
          );


        sessionStorage.removeItem(
          "toeic-return-url"
        );


        window.location.replace(
          returnUrl ||
          "/toeiceveryday/"
        );

      }

      else{

        message.textContent =
          "Mật khẩu không đúng. Vui lòng thử lại.";


        document
          .getElementById("password")
          .select();

      }

    }
  );


document
  .getElementById("showPassword")
  .addEventListener(
    "click",
    () => {

      const input =
        document
          .getElementById("password");


      input.type =
        input.type === "password"
          ? "text"
          : "password";

    }
  );

</script>

</body>

</html>
