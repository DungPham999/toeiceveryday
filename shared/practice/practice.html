<!doctype html>
<html lang="en">
<head>
  <script src="../auth/auth.js"></script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TOEIC Practice</title>
  <link rel="stylesheet" href="./style.css?v=1">
</head>
<body>
<header class="topbar">
  <div>
    <div class="eyebrow">TOEIC PRACTICE</div>
    <h1><strong id="unitTitle">Practice Unit</strong> <span>Practice</span></h1>
  </div>
  <div class="top-actions">
    <div class="progress-wrap"><div id="progressText">0 / 0 answered</div><div class="progress"><div id="progressBar"></div></div></div>
    <a class="header-btn" href="../../">← Trang chủ</a>
    <button id="resetBtn" class="header-btn">↻ Làm lại bài</button>
    <button id="paletteBtn" class="header-btn">☷ Danh sách câu hỏi</button>
    <button class="header-btn" onclick="logoutToeic()">↪ Đăng xuất</button>
  </div>
</header>

<nav id="partTabs" class="part-tabs"></nav>
<nav id="exerciseTabs" class="exercise-tabs"></nav>

<main id="mainLayout" class="layout">
  <section id="sourcePanel" class="source-panel">
    <div id="visualWrap" class="visual-wrap"></div>

    <div id="audioCard" class="player-card hidden">
      <div class="player-top">
        <button id="playBtn" class="play-btn">▶</button>
        <canvas id="waveform" height="82"></canvas>
        <div class="time"><span id="currentTime">00:00</span> / <span id="duration">00:00</span></div>
      </div>
      <div class="player-controls">
        <button id="back3">↶ <b>3s</b></button>
        <button id="back5">↶ <b>5s</b></button>
        <button id="speedBtn">1x</button>
      </div>
    </div>

    <div id="passageWrap" class="passage-wrap hidden">
      <div id="passageHtml" class="passage-card"></div>
    </div>

    <div id="scriptBox" class="script-box hidden">
      <div class="section-title">SCRIPT / EXPLANATION</div>
      <div id="scriptLines"></div>
    </div>
  </section>

  <div id="splitter" class="splitter hidden" title="Kéo để chỉnh độ rộng"><span>⋮</span></div>

  <section id="questionPanel" class="question-panel">
    <div class="question-head"><span id="partBadge" class="badge">Part</span><span id="groupLabel" class="group-label"></span></div>
    <div id="questionScroll" class="question-scroll"><div id="questionArea"></div></div>
    <div id="navRow" class="nav-row">
      <button id="prevBtn" class="nav-btn">← Previous</button>
      <div id="dots" class="dots"></div>
      <button id="nextBtn" class="nav-btn primary">Next →</button>
    </div>
  </section>
</main>

<div id="paletteOverlay" class="palette-overlay hidden">
  <aside class="palette-drawer">
    <div class="palette-head"><div><div class="eyebrow" id="paletteKicker">PRACTICE UNIT</div><h2>Danh sách câu hỏi</h2></div><button id="paletteClose" class="palette-close">×</button></div>
    <div class="palette-stats">
      <span><i class="swatch correct"></i><b id="correctCount">0</b> Đúng</span>
      <span><i class="swatch wrong"></i><b id="wrongCount">0</b> Sai</span>
      <span><i class="swatch todo"></i><b id="todoCount">0</b> Chưa kiểm tra</span>
    </div>
    <div id="paletteSections"></div>
  </aside>
</div>

<audio id="audio" preload="metadata"></audio>
<script src="./loader.js?v=1"></script>
</body>
</html>
